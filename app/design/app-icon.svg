<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="232"/></clipPath>
    <clipPath id="lens"><rect x="176" y="176" width="672" height="672" rx="204"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#e8ecff"/>
    </linearGradient>
    <g id="blobs">
      <rect width="1024" height="1024" fill="#0c0d18"/>
      <circle cx="210" cy="190" r="330" fill="#d9443b" opacity="0.92"/>
      <circle cx="840" cy="860" r="380" fill="#2c57e4"/>
      <circle cx="830" cy="150" r="200" fill="#6b3cc8" opacity="0.45"/>
      <circle cx="170" cy="880" r="200" fill="#12936f" opacity="0.35"/>
    </g>
  </defs>
  <g clip-path="url(#tile)">
    <g filter="url(#soft)"><use href="#blobs"/></g>
    <!-- the lens: its shadow, then the wallpaper seen through it a little magnified and brighter -->
    <rect x="206" y="236" width="612" height="612" rx="196" fill="#000" opacity="0.5" filter="url(#shadow)"/>
    <g clip-path="url(#lens)">
      <g filter="url(#soft)" transform="translate(512 512) scale(1.22) translate(-512 -512)" opacity="0.95"><use href="#blobs"/></g>
      <rect x="176" y="176" width="672" height="672" fill="#fff" opacity="0.12"/>
      <rect x="176" y="176" width="672" height="672" fill="url(#sheen)"/>
      <!-- crossed blades -->
      <g stroke-linecap="round" fill="none">
        <g stroke="#000" stroke-opacity="0.28" transform="translate(0 16)" filter="url(#glow)">
          <path d="M360 360 L640 640 M664 360 L384 640" stroke-width="54"/>
        </g>
        <g stroke="url(#blade)">
          <path d="M360 360 L620 620 M664 360 L404 620" stroke-width="54"/>
          <path d="M574 666 L666 574 M358 574 L450 666" stroke-width="44"/>
        </g>
      </g>
    </g>
    <rect x="179" y="179" width="666" height="666" rx="201" fill="none" stroke="url(#rim)" stroke-width="7"/>
    <rect x="194" y="194" width="636" height="636" rx="188" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="3"/>
    <!-- the tile's own rim -->
    <rect x="3" y="3" width="1018" height="1018" rx="229" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="6"/>
  </g>
</svg>
