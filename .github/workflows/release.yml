# Builds the Windows installer on GitHub's Windows machine.
#
#   - a tag vX.Y.Z (git tag v1.0.1 && git push origin v1.0.1): the installer is a build artifact
#     and is also attached to the GitHub Release vX.Y.Z here (artifacts are deleted after 90 days,
#     release files are not), with its SHA-256; and it is published for the app's own updates;
#   - "Run workflow" (optionally with a version): only the build artifact, no release — unless
#     «Выпустить» is ticked: then, from main, the tag vX.Y.Z is created on the commit built and
#     everything goes as for a pushed tag (for sessions that may not push tags);
#
# Updates in the app (backend/drafter/updates.py): this repository is private, so the app reads
# the releases of a public repository that holds only installers — the variable RELEASES_REPO
# (default kuzak018-arch/dota-drafter-releases). Publishing there needs the secret RELEASES_TOKEN:
# a fine-grained token with "Contents: read and write" on that repository only. Without it the
# build still works, only the app doesn't see the new version. The notes of a version come from
# release-notes/vX.Y.Z.md when there is one.
#
# Needs a release "seed-data" in this repository with seed-data.zip (scripts/publish-seed.ps1 on
# the PC): the constants, icons, model and Stratz data the installer ships.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия, например 1.0.1 (пусто — из tauri.conf.json)"
        required: false
      release:
        description: "Выпустить: создать тег vX.Y.Z и GitHub Release (только из main)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart('v') }
          else { $v = "${{ github.event.inputs.version }}" }
          if (-not $v) { $v = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "версия должна быть вида 1.2.3, а не '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT
          # a release: a pushed tag, or «Выпустить» on a run from main
          $publish = "${{ github.ref_type }}" -eq "tag"
          if ("${{ github.event.inputs.release }}" -eq "true") {
            if ("${{ github.ref }}" -ne "refs/heads/main") { throw "выпускать можно только из main" }
            $publish = $true
          }
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          # release-only settings: just the version of this build
          @{ version = $v } | ConvertTo-Json | Set-Content -Path app/src-tauri/tauri.release.conf.json -Encoding utf8

      - name: Seed data (constants, icons, model, Stratz) from the "seed-data" release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download seed-data --pattern seed-data.zip --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "нет релиза seed-data с seed-data.zip: на ПК выполни scripts/publish-seed.ps1" }
          Expand-Archive seed-data.zip -DestinationPath data -Force
          Get-ChildItem data | Format-Table Name

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Python packages
        run: python -m pip install -r backend/requirements.txt

      - name: Backend (PyInstaller)
        run: python -m PyInstaller backend/drafter-backend.spec --distpath build/backend/dist --workpath build/backend/work --noconfirm

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Node packages
        working-directory: app
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Installer (NSIS)
        working-directory: app
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json

      - name: Find the installer
        id: exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem "app/src-tauri/target/release/bundle/nsis/*_${{ steps.meta.outputs.version }}_x64-setup.exe"
          if (@($exe).Count -ne 1) { throw "ожидался один установщик версии ${{ steps.meta.outputs.version }}, найдено: $(@($exe).Count)" }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "{0}: {1:N1} МБ" -f $exe.Name, ($exe.Length / 1MB)
          # the app installs an update only when its SHA-256 matches this file
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$sha  $($exe.Name.Replace(' ', '.'))" | Set-Content -Path "$($exe.FullName).sha256" -Encoding ascii -NoNewline
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          $notes = "release-notes/v${{ steps.meta.outputs.version }}.md"
          if (-not (Test-Path $notes)) {
            $notes = "release-notes.tmp.md"
            "Dota Drafter ${{ steps.meta.outputs.version }}." | Set-Content -Path $notes -Encoding utf8
          }
          "notes=$notes" >> $env:GITHUB_OUTPUT

      - name: Build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dota-Drafter-${{ steps.meta.outputs.version }}
          path: ${{ steps.exe.outputs.path }}
          if-no-files-found: error

      - name: Attach to the GitHub Release (releases only)
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $exe = "${{ steps.exe.outputs.path }}"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest `
              --title "Dota Drafter ${{ steps.meta.outputs.version }}" `
              --notes-file "${{ steps.exe.outputs.notes }}"
            if ($LASTEXITCODE -ne 0) { throw "не удалось создать релиз $tag" }
          }
          gh release upload $tag $exe "$exe.sha256" --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { throw "не удалось прикрепить установщик к релизу $tag" }

      - name: Publish for in-app updates (releases only)
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: ${{ vars.RELEASES_REPO || 'kuzak018-arch/dota-drafter-releases' }}
        run: |
          if (-not $env:GH_TOKEN) {
            "::warning::нет секрета RELEASES_TOKEN: версия не опубликована в $env:REPO, приложение её не увидит"
            exit 0
          }
          $tag = "${{ steps.meta.outputs.tag }}"
          $exe = "${{ steps.exe.outputs.path }}"
          gh release view $tag --repo $env:REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:REPO --latest --title "Dota Drafter ${{ steps.meta.outputs.version }}" `
              --notes-file "${{ steps.exe.outputs.notes }}"
            if ($LASTEXITCODE -ne 0) { throw "не удалось создать выпуск $tag в $env:REPO (в репозитории должен быть хотя бы один коммит)" }
          }
          gh release upload $tag $exe "$exe.sha256" --repo $env:REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw "не удалось выложить установщик в $env:REPO" }
