# Tests on every push and pull request: backend tests (those needing local data are skipped on
# GitHub's machine: the match base, the model and the icons are not in git) and the UI type check.
name: Check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Python packages
        run: python -m pip install -r backend/requirements.txt

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q tests

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: UI type check
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit -p .
