# Правила «что собрать против драфта».
# tag      — тег из hero_tags (сумма силы тега у врагов, с весом героя: кор/саппорт)
# min      — порог суммы, с которого правило срабатывает
# weight   — any: все враги одинаково; core: важнее коры (вклад = сила × доля игр героя на 1–3 позиции)
# items    — по позициям (1..5): предметы в порядке приоритета, ключи из констант OpenDota
# why      — объяснение; {heroes} — враги с этим тегом
# Пересобрать после правки не нужно: файл читается при каждом запросе.

- tag: magic_burst
  min: 2.0
  weight: any
  items:
    1: [black_king_bar, manta]
    2: [black_king_bar, eternal_shroud]
    3: [pipe, eternal_shroud, black_king_bar]
    4: [glimmer_cape, pipe]
    5: [glimmer_cape, pipe]
  why: "Много магического урона ({heroes}): нужна защита от магии, без неё вас сжигают в драках."

